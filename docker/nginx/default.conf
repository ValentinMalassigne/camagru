# Camagru nginx config: single front controller, static files, /uploads/ with
# PHP execution disabled, security headers, quiet logs.

server {
    listen 80;
    server_name _;
    root /var/www/camagru/public;
    index index.php;

    # Hide the nginx version.
    server_tokens off;

    # Quiet logs: no access log. Errors go to the file set in the main nginx.conf.
    access_log off;

    # Body size aligned with PHP upload limits (app enforces 5 MB).
    client_max_body_size 7m;

    # --- Security headers (applied to every response) -------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'" always;

    # --- Uploaded images: served directly, PHP never executed -----------
    location /uploads/ {
        alias /var/www/camagru/uploads/;
        # No PHP execution under uploads, even if a .php file is placed there.
        location ~ \.php$ {
            return 403;
        }
    }

    # --- Static assets: served by nginx, never through PHP ---------------
    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location = /favicon.png {
        try_files $uri =404;
        expires 1h;
    }

    # --- PHP front controller -------------------------------------------
    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Pass existing security headers set above to the FastCGI response too.
    }

    # Deny direct access to any other PHP file (only index.php is the entry).
    location ~ \.php$ {
        return 404;
    }
}
