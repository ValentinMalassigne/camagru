; Camagru php.ini — runtime settings for security and console silence.
; Errors are logged to a file, never shown to the user or the container console.

display_errors = Off
log_errors = On
error_log = /var/log/camagru/php_errors.log
error_reporting = E_ALL

; Upload limits aligned with nginx (app enforces 5 MB in code).
upload_max_filesize = 6M
post_max_size = 7M

; Session hardening (see spec section 9).
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.cookie_secure = 0
session.use_trans_sid = 0

; mail() is relayed through msmtp (phase 1). msmtp logs to its own file; its
; stderr is discarded so a failed delivery never writes to the container
; console (the failure is still visible in the msmtp log file, and mail()
; still returns false to the app).
sendmail_path = "/usr/bin/msmtp -t 2>/dev/null"

; Timezone and charset defaults.
date.timezone = "UTC"
default_charset = "UTF-8"

; Avoid exposing the PHP version.
expose_php = Off
