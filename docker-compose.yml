# Camagru — docker compose stack.
# Only nginx publishes a port (8080). The DB is internal. Uploads live in a named
# volume shared by php (read-write) and nginx (read-only). Logs go to a named
# volume, never the container console.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 once the server accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    # Quiet the server log: only warnings and above reach the console, and
    # the periodic checkpoint reports stay out of it too (log_checkpoints
    # is on by default in Postgres 15+ and writes LOG-rank lines every five
    # minutes of activity — runtime output, so it must not reach the console).
    command: ["postgres", "-c", "log_min_messages=warning", "-c", "log_checkpoints=off"]
    # No port published to the host.
    expose:
      - "5432"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Application code, read-only is not possible (entrypoint needs bin/), so
      # mount the whole project; only public/ is web-exposed via nginx.
      - .:/var/www/camagru
      - uploads:/var/www/camagru/uploads
      - logs:/var/log/camagru
    # No port published; nginx talks to php-fpm over the internal network.
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8080:80"
    # Replace the main error_log (notice level -> stderr) with a file at
      # "error" level, so the "start worker process" startup notices stay out
      # of the container console. The entrypoint still runs; we exec nginx after.
    command: >
      sh -c "sed -i 's|error_log  /var/log/nginx/error.log notice;|error_log /var/log/camagru/nginx_error.log error;|' /etc/nginx/nginx.conf &&
             exec nginx -g 'daemon off;'"
    volumes:
      - .:/var/www/camagru:ro
      - uploads:/var/www/camagru/uploads:ro
      - logs:/var/log/camagru
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      # Silence the nginx image's entrypoint informational log lines.
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"

volumes:
  db_data:
  uploads:
  logs:

