# Camagru — docker compose stack (logging_change branch).
# Only nginx publishes a port (80). The DB is internal. Uploads live in a named
# volume shared by php (read-write) and nginx (read-only).
# Native logging: every service writes to its container console (stdout/stderr),
# visible in `docker compose logs`; no log files, no silencing.

services:
  db:
    # Built from docker/db/Dockerfile: official postgres + musl-locales so
    # initdb locale probe succeeds (fixes the "no usable system locales"
    # warning).
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # scram on socket and localhost connections at first init: fixes
      # initdb "trust" warning and hardens local auth. Applies only
      # during the first initialisation of an empty volume.
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 once the server accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    # Checkpoint reports are periodic maintenance noise (one pair every
    # 5 minutes of activity), not errors: keep them out of the console.
    command: ["postgres", "-c", "log_checkpoints=off"]

    # No port published to the host.
    expose:
      - "5432"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Application code, read-only is not possible (entrypoint needs bin/), so
      # mount the whole project; only public/ is web-exposed via nginx.
      - .:/var/www/camagru
      - uploads:/var/www/camagru/uploads
    # No port published; nginx talks to php-fpm over the internal network.
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "80:80"
    volumes:
      - .:/var/www/camagru:ro
      - uploads:/var/www/camagru/uploads:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
  uploads:
